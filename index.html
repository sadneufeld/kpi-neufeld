<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPI Supervisores - Neufeld</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --verde-neufeld: #27ae60;
            --verde-claro: #e8f6ef;
            --verde-oscuro: #1e8449;
            --bg-light: #f8fafc;
            --navy: #0f172a;
            --text-main: #334155;
            --rojo: #ef4444;
            --amarillo: #f59e0b;
            --border: #e2e8f0;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: #f4f6f9; 
            color: var(--text-main); 
            margin: 0; 
            padding: 0;
            display: flex;
        }

        nav {
            width: 240px;
            background-color: #ffffff;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding-top: 20px;
            z-index: 100;
        }

        .nav-btn {
            width: 100%;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            border: none;
            background: none;
            color: #64748b;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95em;
            transition: 0.2s;
            text-align: left;
            border-left: 4px solid transparent;
        }
        .nav-btn:hover { background: var(--verde-claro); color: var(--verde-neufeld); }
        .nav-btn.active { background: var(--verde-claro); color: var(--verde-neufeld); border-left-color: var(--verde-neufeld); }
        .nav-btn .icon { margin-right: 12px; font-size: 1.1em; }

        .main-content {
            margin-left: 240px;
            flex: 1;
            padding: 30px;
            min-height: 100vh;
            box-sizing: border-box;
            position: relative;
            z-index: 1;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
        }
        .header-top h2 { margin: 0; color: #000000; font-size: 1.4rem; font-weight: 700; }
        .header-top img { height: 45px; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .registro-card { background: #ffffff; border: 1px solid var(--border); border-radius: 12px; padding: 25px; margin-bottom: 30px; box-shadow: 0 2px 12px rgba(0,0,0,0.01); }
        .controles-top { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 25px; align-items: flex-end; }
        .input-group { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 180px; }
        .input-group label { font-size: 0.8em; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }

        .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 25px; }
        .kpi-card { 
            position: relative; border: 1px solid var(--border); background-color: #ffffff; border-radius: 8px; padding: 18px; cursor: pointer;
            transition: all 0.2s ease; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px;
        }
        .kpi-card:hover { border-color: var(--verde-neufeld); background: var(--verde-claro); }
        .kpi-card.active { border-color: var(--verde-neufeld); background: var(--verde-claro); }
        .kpi-card input[type="checkbox"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; margin: 0; cursor: pointer; }
        .kpi-card .kpi-label { font-size: 0.9em; font-weight: 600; color: var(--navy); }
        .kpi-card .kpi-pts { font-size: 0.75em; color: #64748b; background: #f1f5f9; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
        
        .switch-container { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 0.9em; height: 40px; }
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .3s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--verde-neufeld); }
        input:checked + .slider:before { transform: translateX(20px); }

        .table-container { overflow-x: auto; margin-top: 15px; border-radius: 8px; border: 1px solid var(--border); background: white; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85em; min-width: 1000px; }
        th { background: #f8fafc; color: var(--navy); padding: 12px; text-align: center; font-weight: 700; border-bottom: 1px solid var(--border); }
        td { padding: 12px; border-top: 1px solid var(--border); text-align: center; }
        
        .btn-guardar { background: var(--verde-neufeld); color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 1em; }
        .btn-guardar:hover { background: var(--verde-oscuro); }
        .semaforo { padding: 4px 8px; border-radius: 4px; color: white; font-weight: bold; }
        .rojo { background: var(--rojo); } .amarillo { background: var(--amarillo); } .verde { background: var(--verde-neufeld); }
        
        select, input[type="date"], input[type="text"], input[type="number"] { padding: 9px; border-radius: 6px; border: 1px solid var(--border); font-size: 0.95em; outline: none; box-sizing: border-box; }
        .btn-action { background: none; border: none; cursor: pointer; font-size: 1.15em; padding: 2px 6px; }

        #loadingOverlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.85); z-index: 50000; justify-content: center; align-items: center; flex-direction: column;
        }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid var(--verde-neufeld); border-radius: 50%; width: 35px; height: 35px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loadingOverlay">
    <div class="spinner"></div>
    <p style="font-weight: bold; margin-top: 10px; font-size: 0.9em;">Sincronizando con la nube...</p>
</div>

<nav>
    <button class="nav-btn active" onclick="switchTab('tab-registro', this)">
        <span class="icon">📋</span>Historial e Inicios
    </button>
    <button class="nav-btn" onclick="switchTab('tab-supervisores', this)">
        <span class="icon">👤</span>Resultados Supervisor
    </button>
    <button class="nav-btn" onclick="switchTab('tab-sucursales', this)">
        <span class="icon">🏠</span>Resultados Sucursal
    </button>
</nav>

<div class="main-content">
    <div class="header-top">
        <h2>KPI Supervisores</h2>
        <img src="Logo Pasteleria Neufeld.png" alt="Logo Neufeld">
    </div>
    
    <div class="registro-card" style="padding: 15px 20px; margin-bottom: 20px; display: flex; align-items: center; gap: 15px;">
        <label style="font-weight: bold; font-size: 0.95em;">Filtro de Análisis General (Mes):</label>
        <select id="filtroMes" onchange="procesarYRenderizarTodo()" style="width: 150px;">
            <option value="0">Enero</option><option value="1">Febrero</option><option value="2">Marzo</option><option value="3">Abril</option><option value="4">Mayo</option><option value="5">Junio</option><option value="6">Julio</option><option value="7">Agosto</option><option value="8">Septiembre</option><option value="9">Octubre</option><option value="10">Noviembre</option><option value="11">Diciembre</option>
        </select>
    </div>

    <div id="tab-registro" class="tab-content active">
        <div class="registro-card">
            <div style="font-weight: 700; font-size: 1.1em; margin-bottom: 20px; color: var(--navy);">📝 Registro de Evaluación</div>
            
            <div class="controles-top">
                <div class="input-group">
                    <label>Supervisor</label>
                    <select id="sup" onchange="cargarSucursalesFormulario()">
                        <option value="">Seleccionar...</option>
                        <option value="ADRIANA">ADRIANA</option>
                        <option value="CITLALLI">CITLALLI</option>
                        <option value="KARLA">KARLA</option>
                        <option value="LEONARDO">LEONARDO</option>
                        <option value="NOEMI">NOEMI</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Sucursal</label>
                    <select id="sucursal"><option value="">Selecciona un supervisor...</option></select>
                </div>
                <div class="input-group">
                    <label>Fecha de Auditoría</label>
                    <input type="date" id="fecha">
                </div>
                <div class="input-group" style="max-width: 180px;">
                    <label>Calificación Tienda (%)</label>
                    <input type="number" id="califTienda" min="0" max="100" placeholder="Ej: 95">
                </div>
                <div class="input-group" style="flex: 0; min-width: 140px;">
                    <div class="switch-container">
                        <span>¿Visitó Sucursal?</span>
                        <label class="switch">
                            <input type="checkbox" id="realizoVisita" checked onchange="toggleVisita(this.checked)">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="kpi-grid" id="checksContainer">
                <label class="kpi-card"><span class="kpi-label">Visita programada</span><span class="kpi-pts">15 pts</span><input type="checkbox" class="kpi" data-r="vis" value="15" onchange="updateCardStyle(this)"></label>
                <label class="kpi-card"><span class="kpi-label">Checklist</span><span class="kpi-pts">15 pts</span><input type="checkbox" class="kpi" data-r="chk" value="15" onchange="updateCardStyle(this)"></label>
                <label class="kpi-card"><span class="kpi-label">Arqueo</span><span class="kpi-pts">15 pts</span><input type="checkbox" class="kpi" data-r="arq" value="15" onchange="updateCardStyle(this)"></label>
                <label class="kpi-card"><span class="kpi-label">Adeudos</span><span class="kpi-pts">15 pts</span><input type="checkbox" class="kpi" data-r="ade" value="15" onchange="updateCardStyle(this)"></label>
                <label class="kpi-card"><span class="kpi-label">Rotación de personal</span><span class="kpi-pts">10 pts</span><input type="checkbox" class="kpi" data-r="rot" value="10" onchange="updateCardStyle(this)"></label>
                <label class="kpi-card"><span class="kpi-label">Asistencia</span><span class="kpi-pts">10 pts</span><input type="checkbox" class="kpi" data-r="asi" value="10" onchange="updateCardStyle(this)"></label>
                <label class="kpi-card"><span class="kpi-label">Conteo de producto</span><span class="kpi-pts">10 pts</span><input type="checkbox" class="kpi" data-r="pro" value="10" onchange="updateCardStyle(this)"></label>
                <label class="kpi-card"><span class="kpi-label">Productividad en tienda</span><span class="kpi-pts">10 pts</span><input type="checkbox" class="kpi" data-r="pty" value="10" onchange="updateCardStyle(this)"></label>
            </div>
            <button class="btn-guardar" onclick="guardarEnNube()">FINALIZAR Y GUARDAR REPORTE</button>
        </div>

        <div class="table-container">
            <table id="mainTable">
                <thead>
                    <tr>
                        <th>Supervisor</th><th>Sucursal</th><th>Fecha</th><th>Visitas</th><th>Check list</th><th>Arqueos</th><th>Adeudos</th><th>Rotación</th><th>Asistencia</th><th>Conteo</th><th>Participación</th><th>Total KPI</th>
                        <th>Calif. Tienda</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaBody"></tbody>
            </table>
        </div>
    </div>

    <div id="tab-supervisores" class="tab-content">
        <div class="registro-card"><canvas id="comparativaChart" height="150"></canvas></div>
        <div id="radarContainer" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px;"></div>
    </div>

    <div id="tab-sucursales" class="tab-content">
        <div class="registro-card" style="display: flex; flex-wrap: wrap; gap: 15px; align-items: center; padding: 15px 20px; margin-bottom: 20px;">
            <div class="input-group" style="max-width: 250px;">
                <label>Filtrar por Zona (Supervisor)</label>
                <select id="filtroGraficaZona" onchange="actualizarFiltrosGrafica('zona')">
                    <option value="TODOS">Todas las Zonas</option>
                    <option value="ADRIANA">Zona ADRIANA</option>
                    <option value="CITLALLI">Zona CITLALLI</option>
                    <option value="KARLA">Zona KARLA</option>
                    <option value="LEONARDO">Zona LEONARDO</option>
                    <option value="NOEMI">Zona NOEMI</option>
                </select>
            </div>
            <div class="input-group" style="max-width: 250px;">
                <label>Filtrar por Sucursal Específica</label>
                <select id="filtroGraficaSucursal" onchange="actualizarFiltrosGrafica('sucursal')">
                    <option value="TODAS">Todas las Sucursales</option>
                </select>
            </div>
        </div>
        <div class="registro-card">
            <canvas id="sucursalesBarChartReal" height="200"></canvas>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr><th>Sucursal</th><th>Supervisor a Cargo</th><th>Promedio % Mes</th></tr>
                </thead>
                <tbody id="sucursalesTablaBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyp4US04tdcDm3Kxgbz3D7XgpJIb20deIh8oM6ZYNfq_OGdsxgJjsDpFD1-g7xXlPeh/exec";
    const CODIGO_SEGURIDAD = "Neufeld2024";
    let datosGlobales = [];

    const sucursalesData = {
        "ADRIANA": ["ACA - Avila Camacho", "IND - Independencia", "RCE - Real Center", "SIS - San Isidro", "SLU - Santa Lucia", "TES - Tesistan", "TET - Tetlan", "TRA - Transito"],
        "CITLALLI": ["AME - Americas", "CHA - Chapultepec", "FED - Federalta", "LPA - La Paz", "OBL - Oblatos", "POR - Punto Oriente", "REV - Revolucion", "TEC - Technology"],
        "KARLA": ["ALC - Alcalde", "COL - Colon", "ETE - Expendio Tepeyac", "GCO - Golfo de Cortes", "GUA - Guadalupe", "ING - Inglaterra", "JUA - Juarez", "NOB - Niño Obrero"],
        "LEONARDO": ["AER - Aeropuerto", "ALT - Altea", "CPI - Centro las Pintas", "CON - Concepcion", "RMI - R Michel", "RPL - Rio Plaza", "SFE - Santa Fe", "TLA - Tlaquepaque", "TON - Tonala"],
        "NOEMI": ["BUG - Bugambilias", "CRE - Camino Real", "CGR - Ciudad Granja", "GAL - Galerias", "HIS - Historiadores", "LCA - La Calma", "LPL - Lapislazuli", "MOT - Mariano Otero", "PSO - Plaza del Sol"]
    };

    function switchTab(tabId, btn) {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
    }

    function updateCardStyle(el) {
        if(el.checked) el.parentElement.classList.add('active');
        else el.parentElement.classList.remove('active');
    }

    function toggleVisita(valor) {
        document.querySelectorAll('.kpi').forEach(c => {
            c.disabled = !valor;
            if(!valor) { c.checked = false; c.parentElement.classList.remove('active'); }
        });
    }

    function cargarSucursalesFormulario() {
        const sup = document.getElementById('sup').value; 
        const combo = document.getElementById('sucursal');
        combo.innerHTML = '';
        if(sup && sucursalesData[sup]) {
            sucursalesData[sup].forEach(s => combo.add(new Option(s, s)));
        } else {
            combo.add(new Option("Selecciona un supervisor...", ""));
        }
    }

    function toggleLoading(show) { document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none'; }

    async function cargarDatosNube() {
        toggleLoading(true);
        try {
            const resp = await fetch(WEB_APP_URL);
            datosGlobales = await resp.json();
            procesarYRenderizarTodo();
        } catch(e) { console.error(e); }
        toggleLoading(false);
    }

    function procesarYRenderizarTodo() {
        if (!datosGlobales || datosGlobales.length <= 1) return;
        renderOp1Historial();
        inyectarSucursalesFiltroGrafica();
    }

    function renderOp1Historial() {
        const mes = parseInt(document.getElementById('filtroMes').value);
        const body = document.getElementById('tablaBody');
        body.innerHTML = '';
        
        datosGlobales.slice(1).reverse().forEach((r, idxOriginal) => {
            if(!r[3]) return;
            const f = new Date(r[3]);
            if(f.getMonth() === mes) {
                const color = r[13] >= 90 ? 'verde' : (r[13] >= 70 ? 'amarillo' : 'rojo');
                
                // Leemos la nueva columna de calificación (Normalmente la Columna N / Índice 14 en el arreglo si agregaste la columna al final del renglón básico)
                const califTiendaValor = r[14] !== undefined && r[14] !== null && r[14] !== "" ? r[14] + "%" : "N/A";
                
                const realIdFila = datosGlobales.length - idxOriginal;

                body.innerHTML += `<tr>
                    <td style="font-weight:600;">${r[1].toString().toUpperCase()}</td>
                    <td>${r[2]}</td>
                    <td>${String(r[3]).split('T')[0]}</td>
                    <td>${r[5]}</td><td>${r[6]}</td><td>${r[7]}</td><td>${r[8]}</td>
                    <td>${r[9]}</td><td>${r[10]}</td><td>${r[11]}</td><td>${r[12]}</td>
                    <td><span class="semaforo ${color}">${r[13]}%</span></td>
                    <td style="font-weight: bold; color: var(--navy);">${califTiendaValor}</td>
                    <td>
                        <button class="btn-action" onclick="borrarRegistro(${realIdFila})" title="Eliminar">🗑️</button>
                    </td>
                </tr>`;
            }
        });
    }

    function inyectarSucursalesFiltroGrafica() {
        const zonaSeleccionada = document.getElementById('filtroGraficaZona').value;
        const comboSucursal = document.getElementById('filtroGraficaSucursal');
        
        const valorActual = comboSucursal.value || "TODAS";
        comboSucursal.innerHTML = '<option value="TODAS">Todas las Sucursales</option>';
        
        if (zonaSeleccionada === "TODOS") {
            Object.keys(sucursalesData).forEach(z => {
                sucursalesData[z].forEach(s => comboSucursal.add(new Option(s, s)));
            });
        } else if (sucursalesData[zonaSeleccionada]) {
            sucursalesData[zonaSeleccionada].forEach(s => comboSucursal.add(new Option(s, s)));
        }
        
        if([...comboSucursal.options].some(o => o.value === valorActual)) {
            comboSucursal.value = valorActual;
        }
        
        actualizarTablaYSucursales();
    }

    function actualizarFiltrosGrafica(tipo) {
        if (tipo === 'zona') {
            document.getElementById('filtroGraficaSucursal').value = "TODAS";
            inyectarSucursalesFiltroGrafica();
        } else {
            actualizarTablaYSucursales();
        }
    }

    function actualizarTablaYSucursales() {
        const mes = parseInt(document.getElementById('filtroMes').value);
        const zona = document.getElementById('filtroGraficaZona').value;
        const sucursal = document.getElementById('filtroGraficaSucursal').value;
        const body = document.getElementById('sucursalesTablaBody');
        
        body.innerHTML = '';
        
        datosGlobales.slice(1).forEach(r => {
            if(!r[3]) return;
            const f = new Date(r[3]);
            if(f.getMonth() === mes) {
                const cumpleZona = (zona === "TODOS" || r[1].toString().toUpperCase() === zona);
                const cumpleSucursal = (sucursal === "TODAS" || r[2] === sucursal);
                
                if(cumpleZona && cumpleSucursal) {
                    const color = r[13] >= 90 ? 'verde' : (r[13] >= 70 ? 'amarillo' : 'rojo');
                    body.innerHTML += `<tr>
                        <td>${r[2]}</td>
                        <td>${r[1].toString().toUpperCase()}</td>
                        <td><span class="semaforo ${color}">${r[13]}%</span></td>
                    </tr>`;
                }
            }
        });
    }

    async function guardarEnNube() {
        const s = document.getElementById('sup').value;
        if(!s) return alert("Por favor selecciona un Supervisor");
        
        toggleLoading(true);
        const visVal = document.getElementById('realizoVisita').checked;
        const califTiendaInput = document.getElementById('califTienda').value;

        const reg = { 
            action: 'guardar', s, 
            suc: document.getElementById('sucursal').value, 
            f: document.getElementById('fecha').value, 
            realizado: visVal, 
            vis:0, chk:0, arq:0, ade:0, rot:0, asi:0, pro:0, pty:0, total:0,
            // ENVIAMOS EL NUEVO CAMPO HACIA GOOGLE SHEETS
            califTienda: califTiendaInput ? califTiendaInput : "" 
        };

        if(visVal) {
            document.querySelectorAll('.kpi:checked').forEach(i => { reg[i.dataset.r] = parseInt(i.value); reg.total += parseInt(i.value); });
        }

        await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(reg) });
        
        // Limpiamos el nuevo campo de calificación
        document.getElementById('califTienda').value = '';
        document.querySelectorAll('.kpi').forEach(c => { c.checked = false; c.parentElement.classList.remove('active'); });
        
        setTimeout(cargarDatosNube, 1500);
    }

    async function borrarRegistro(idFila) {
        if(prompt("Contraseña de seguridad requerida:") === CODIGO_SEGURIDAD) {
            toggleLoading(true);
            await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({action: 'borrar', idFila}) });
            setTimeout(cargarDatosNube, 1500);
        }
    }

    window.onload = () => {
        document.getElementById('fecha').value = new Date().toISOString().split('T')[0];
        document.getElementById('filtroMes').value = new Date().getMonth();
        cargarDatosNube();
    };
</script>
</body>
</html>
