<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPI Supervisores - Neufeld</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --verde-neufeld: #27ae60;
            --verde-oscuro: #1e8449;
            --bg-light: #f4f7f6;
            --navy: #0f172a;
            --text-main: #334155;
            --rojo: #ef4444;
            --amarillo: #f59e0b;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-light); 
            color: var(--text-main);
            margin: 0; padding: 20px;
        }

        .container { max-width: 1400px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); position: relative; }

        /* HEADER & LOGO */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid var(--bg-light); padding-bottom: 20px; }
        .logo-container img { height: 80px; width: auto; filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.1)); }
        
        /* CARGANDO OVERLAY */
        #loadingOverlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.8); z-index: 1000; justify-content: center; align-items: center; flex-direction: column;
        }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid var(--verde-neufeld); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* FORMULARIO */
        .registro-panel { background: var(--navy); color: white; padding: 25px; border-radius: 12px; margin-bottom: 30px; }
        .controles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .checks-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; }
        .check-card { 
            background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px; 
            display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.1); 
        }
        .info-icon { 
            cursor: pointer; background: #64748b; color: white; border-radius: 50%; 
            width: 18px; height: 18px; display: inline-flex; justify-content: center; align-items: center; font-size: 12px; margin-left: 8px;
        }

        /* DASHBOARD */
        .dashboard-controls { background: #fff; border: 1px solid #e2e8f0; padding: 20px; border-radius: 12px; margin-bottom: 20px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 25px; }
        .chart-box { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; position: relative; }
        .score-badge { position: absolute; top: 20px; right: 20px; padding: 10px 15px; border-radius: 8px; font-weight: bold; font-size: 1.2em; color: white; }

        /* COMPARATIVA */
        .comparativa-section { margin-top: 40px; background: #f8fafc; padding: 25px; border-radius: 12px; border: 1px solid #e2e8f0; }

        /* TABLA */
        .table-container { overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
        th { background: #f8fafc; color: #64748b; padding: 12px; text-align: center; border-bottom: 2px solid #e2e8f0; }
        td { padding: 12px; border-bottom: 1px solid #f1f5f9; text-align: center; }

        .btn-guardar { 
            background: var(--verde-neufeld); color: white; border: none; padding: 15px; 
            border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 20px; font-size: 16px;
        }
        .btn-guardar:hover { background: var(--verde-oscuro); }
        .semaforo { padding: 5px 10px; border-radius: 6px; color: white; font-weight: bold; }
        select, input { padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1; width: 100%; }
    </style>
</head>
<body>

<div id="loadingOverlay">
    <div class="spinner"></div>
    <p id="loadingText" style="margin-top:15px; font-weight:bold; color: var(--navy);">Cargando datos...</p>
</div>

<div class="container">
    <div class="header">
        <h1 style="margin:0; color: var(--navy);">KPI Supervisores</h1>
        <div class="logo-container">
            <img src="Logo Pasteleria Neufeld.png" alt="Neufeld Logo">
        </div>
    </div>

    <!-- PANEL DE REGISTRO -->
    <div class="registro-panel">
        <div class="controles">
            <div>
                <label>Supervisor</label>
                <select id="sup" onchange="cargarSucursales()">
                    <option value="">Seleccionar...</option>
                    <option value="Adriana">ADRIANA</option>
                    <option value="Citlalli">CITLALLI</option>
                    <option value="Karla">KARLA</option>
                    <option value="Leonardo">LEONARDO</option>
                    <option value="Noemi">NOEMI</option>
                </select>
            </div>
            <div><label>Sucursal</label><select id="sucursal"></select></div>
            <div><label>Fecha</label><input type="date" id="fecha"></div>
        </div>

        <div class="checks-grid">
            <div class="check-card">
                <span>Visitas (15) <span class="info-icon" onclick="verInfo('vis')">?</span></span>
                <input type="checkbox" class="kpi" data-r="vis" value="15">
            </div>
            <div class="check-card">
                <span>Checklist (15) <span class="info-icon" onclick="verInfo('chk')">?</span></span>
                <input type="checkbox" class="kpi" data-r="chk" value="15">
            </div>
            <div class="check-card">
                <span>Arqueo (15) <span class="info-icon" onclick="verInfo('arq')">?</span></span>
                <input type="checkbox" class="kpi" data-r="arq" value="15">
            </div>
            <div class="check-card">
                <span>Adeudos (15) <span class="info-icon" onclick="verInfo('ade')">?</span></span>
                <input type="checkbox" class="kpi" data-r="ade" value="15">
            </div>
            <div class="check-card">
                <span>Rotación (10) <span class="info-icon" onclick="verInfo('rot')">?</span></span>
                <input type="checkbox" class="kpi" data-r="rot" value="10">
            </div>
            <div class="check-card">
                <span>Asistencia (10) <span class="info-icon" onclick="verInfo('asi')">?</span></span>
                <input type="checkbox" class="kpi" data-r="asi" value="10">
            </div>
            <div class="check-card">
                <span>Producto (10) <span class="info-icon" onclick="verInfo('pro')">?</span></span>
                <input type="checkbox" class="kpi" data-r="pro" value="10">
            </div>
            <div class="check-card">
                <span>Productividad (10) <span class="info-icon" onclick="verInfo('pty')">?</span></span>
                <input type="checkbox" class="kpi" data-r="pty" value="10">
            </div>
        </div>
        <button class="btn-guardar" onclick="guardarEnNube()">GUARDAR REPORTE</button>
    </div>

    <!-- DASHBOARD CONTROLS -->
    <div class="dashboard-controls">
        <div style="flex: 1;">
            <label>Filtrar Mes:</label>
            <select id="filtroMes" onchange="actualizarTodo()">
                <option value="0">Enero</option><option value="1">Febrero</option><option value="2">Marzo</option>
                <option value="3">Abril</option><option value="4">Mayo</option><option value="5">Junio</option>
                <option value="6">Julio</option><option value="7">Agosto</option><option value="8">Septiembre</option>
                <option value="9">Octubre</option><option value="10">Noviembre</option><option value="11">Diciembre</option>
            </select>
        </div>
        <div style="flex: 1;">
            <label>Filtrar Supervisor en Historial:</label>
            <select id="filtroSup" onchange="renderTabla()">
                <option value="Todos">Todos los supervisores</option>
                <option value="Adriana">Adriana</option><option value="Citlalli">Citlalli</option>
                <option value="Karla">Karla</option><option value="Leonardo">Leonardo</option>
                <option value="Noemi">Noemi</option>
            </select>
        </div>
    </div>

    <!-- RADARS -->
    <div class="dashboard-grid" id="radarContainer"></div>

    <!-- COMPARATIVA BAR CHART -->
    <div class="comparativa-section">
        <h3 style="margin-top:0">Comparativa General del Mes</h3>
        <div style="height: 300px;"><canvas id="comparativaChart"></canvas></div>
    </div>

    <!-- HISTORIAL -->
    <h3 style="margin-top:40px; border-bottom: 2px solid var(--verde-neufeld); padding-bottom: 10px;">Historial Mensual Detallado</h3>
    <div class="table-container">
        <table id="tablaKPI">
            <thead>
                <tr>
                    <th>Supervisor</th><th>Sucursal</th><th>Fecha</th><th>Vis</th><th>Chk</th><th>Arq</th><th>Ade</th><th>Rot</th><th>Asi</th><th>Pro</th><th>Pty</th><th>Total</th><th>Acción</th>
                </tr>
            </thead>
            <tbody id="tablaBody"></tbody>
        </table>
    </div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwjPp1Fbz7GkUcoTRTV-ECYwr6X8uYY_slu-2FzDE8t_71SO-leVQBx56b--VIvsmEH/exec";
    const CODIGO_SEGURIDAD = "Neufeld2024";
    let datosGlobales = [];
    let comparativaChart = null;

    // DESCRIPCIONES DE LOS BOTONES DE INFO
    const descripciones = {
        vis: "Se califica la puntualidad y cumplimiento del calendario de visitas programadas.",
        chk: "Evaluación de la limpieza, acomodo y estándares operativos de la sucursal.",
        arq: "Cero descuadres en caja y correcto manejo de vouchers de terminal.",
        ade: "Seguimiento y cobro efectivo de adeudos de clientes o personal.",
        rot: "Mantenimiento de plantilla completa y baja rotación de personal.",
        asi: "Puntualidad del supervisor y asistencia sin faltas justificadas.",
        pro: "Correcta rotación de fechas (PEPS) y calidad del producto exhibido.",
        pty: "Alcance de metas de venta y eficiencia operativa de la tienda."
    };

    function verInfo(key) { alert(descripciones[key]); }

    function toggleLoading(show, text = "Cargando...") {
        const overlay = document.getElementById('loadingOverlay');
        document.getElementById('loadingText').innerText = text;
        overlay.style.display = show ? 'flex' : 'none';
    }

    const sucursalesData = {
        "Adriana": ["ACA - Avila Camacho", "IND - Independencia", "RCE - Real Center", "SIS - San Isidro", "SLU - Santa Lucia", "TES - Tesistan", "TET - Tetlan", "TRA - Transito"],
        "Citlalli": ["AME - Americas", "CHA - Chapultepec", "FED - Federalta", "LPA - La Paz", "OBL - Oblatos", "POR - Punto Oriente", "REV - Revolucion", "TEC - Technology"],
        "Karla": ["ALC - Alcalde", "COL - Colon", "ETE - Expendio Tepeyac", "GCO - Golfo de Cortes", "GUA - Guadalupe", "ING - Inglaterra", "JUA - Juarez", "NOB - Niño Obrero"],
        "Leonardo": ["AER - Aeropuerto", "ALT - Altea", "CPI - Centro las Pintas", "CON - Concepcion", "RMI - R Michel", "RPL - Rio Plaza", "SFE - Santa Fe", "TLA - Tlaquepaque", "TON - Tonala"],
        "Noemi": ["BUG - Bugambilias", "CRE - Camino Real", "CGR - Ciudad Granja", "GAL - Galerias", "HIS - Historiadores", "LCA - La Calma", "LPL - Lapislazuli", "MOT - Mariano Otero", "PSO - Plaza del Sol"]
    };

    function cargarSucursales() {
        const sup = document.getElementById('sup').value;
        const combo = document.getElementById('sucursal');
        combo.innerHTML = '';
        if(sup) sucursalesData[sup].forEach(s => combo.add(new Option(s, s)));
    }

    async function actualizarTodo() {
        toggleLoading(true, "Actualizando Dashboard...");
        try {
            const response = await fetch(WEB_APP_URL);
            datosGlobales = await response.json();
            renderDashboard();
            renderTabla();
        } catch (e) { alert("Error al cargar datos"); }
        toggleLoading(false);
    }

    function renderDashboard() {
        const mes = parseInt(document.getElementById('filtroMes').value);
        const container = document.getElementById('radarContainer');
        container.innerHTML = '';
        
        let stats = {};
        const supervisores = ["Adriana", "Citlalli", "Karla", "Leonardo", "Noemi"];

        // Filtrar y agrupar datos
        datosGlobales.slice(1).forEach(r => {
            const f = new Date(r[3]);
            if(f.getMonth() === mes) {
                if(!stats[r[1]]) stats[r[1]] = { vis:0, chk:0, arq:0, ade:0, rot:0, asi:0, pro:0, pty:0, total:0, c:0 };
                const s = stats[r[1]];
                s.vis+=r[5]; s.chk+=r[6]; s.arq+=r[7]; s.ade+=r[8]; s.rot+=r[9]; s.asi+=r[10]; s.pro+=r[11]; s.pty+=r[12]; s.total+=r[13]; s.c++;
            }
        });

        supervisores.forEach(sup => {
            if(!stats[sup]) return;
            const s = stats[sup];
            const avgTotal = (s.total / s.c).toFixed(1);
            const color = avgTotal >= 90 ? 'var(--verde-neufeld)' : (avgTotal >= 70 ? 'var(--amarillo)' : 'var(--rojo)');

            const box = document.createElement('div');
            box.className = 'chart-box';
            box.innerHTML = `
                <div class="score-badge" style="background:${color}">${avgTotal}%</div>
                <h3 style="margin-top:0">${sup}</h3>
                <canvas id="radar-${sup}"></canvas>
            `;
            container.appendChild(box);

            new Chart(document.getElementById(`radar-${sup}`), {
                type: 'radar',
                data: {
                    labels: [['Visitas', 'Prog.'], ['Checklist', 'Operativo'], ['Arqueo', 'Caja'], ['Control', 'Adeudos'], ['Rotación', 'Personal'], ['Asis.', 'Puntual'], ['Revisión', 'Producto'], ['Prod.', 'Tienda']],
                    datasets: [{
                        label: 'Promedio',
                        data: [s.vis/s.c, s.chk/s.c, s.arq/s.c, s.ade/s.c, s.rot/s.c, s.asi/s.c, s.pro/s.c, s.pty/s.c],
                        backgroundColor: 'rgba(39, 174, 96, 0.2)', borderColor: var(--verde-neufeld), borderWidth: 2
                    }]
                },
                options: { 
                    scales: { r: { min: 0, max: 15, ticks: { display: false } } },
                    plugins: { legend: { display: false } }
                }
            });
        });

        renderComparativa(stats);
    }

    function renderComparativa(stats) {
        const ctx = document.getElementById('comparativaChart').getContext('2d');
        if(comparativaChart) comparativaChart.destroy();
        
        const labels = Object.keys(stats);
        const data = labels.map(l => (stats[l].total / stats[l].c).toFixed(1));

        comparativaChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: '% Cumplimiento Promedio',
                    data: data,
                    backgroundColor: var(--verde-neufeld),
                    borderRadius: 5
                }]
            },
            options: { maintainAspectRatio: false, scales: { y: { beginAtZero: true, max: 100 } } }
        });
    }

    function renderTabla() {
        const mes = parseInt(document.getElementById('filtroMes').value);
        const supFiltro = document.getElementById('filtroSup').value;
        const body = document.getElementById('tablaBody');
        body.innerHTML = '';

        datosGlobales.slice(1).reverse().forEach((r, i) => {
            const f = new Date(r[3]);
            if(f.getMonth() === mes && (supFiltro === "Todos" || r[1] === supFiltro)) {
                const color = r[13] >= 90 ? 'verde' : (r[13] >= 70 ? 'amarillo' : 'rojo');
                body.innerHTML += `
                    <tr>
                        <td><b>${r[1]}</b></td><td>${r[2]}</td><td>${r[3]}</td>
                        <td>${r[5]}</td><td>${r[6]}</td><td>${r[7]}</td><td>${r[8]}</td>
                        <td>${r[9]}</td><td>${r[10]}</td><td>${r[11]}</td><td>${r[12]}</td>
                        <td><span class="semaforo ${color}">${r[13]}%</span></td>
                        <td><button style="cursor:pointer; border:none; background:none" onclick="borrarRegistro(${datosGlobales.length - i})">🗑️</button></td>
                    </tr>`;
            }
        });
    }

    async function guardarEnNube() {
        const s = document.getElementById('sup').value;
        if(!s) return alert("Selecciona Supervisor");
        toggleLoading(true, "Guardando Reporte...");

        const reg = {
            action: 'guardar', s, suc: document.getElementById('sucursal').value, 
            f: document.getElementById('fecha').value, realizado: true,
            vis:0, chk:0, arq:0, ade:0, rot:0, asi:0, pro:0, pty:0, total:0
        };

        document.querySelectorAll('.kpi:checked').forEach(i => {
            reg[i.dataset.r] = parseInt(i.value);
            reg.total += parseInt(i.value);
        });

        await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(reg) });
        actualizarTodo();
    }

    async function borrarRegistro(idFila) {
        const pass = prompt("Contraseña Administrador:");
        if(pass === CODIGO_SEGURIDAD) {
            toggleLoading(true, "Eliminando...");
            await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({action: 'borrar', idFila}) });
            actualizarTodo();
        }
    }

    // INICIO
    document.getElementById('fecha').valueAsDate = new Date();
    document.getElementById('filtroMes').value = new Date().getMonth();
    actualizarTodo();

    // Helper para usar colores en JS
    function var(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
</script>

</body>
</html>
